name: Build IPK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Script syntax
        run: |
          for f in scripts/*.sh; do sh -n "$f" || exit 1; done
          for f in scripts/*.js app/*.js tests/*.js; do node --check "$f" || exit 1; done
          jq . app/appinfo.json > /dev/null

      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Smoke test (every layout and Settings page)
        run: SHOTS=shots node tests/smoke.js

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Set version
        run: |
          jq --arg v "1.0.${{ github.run_number }}" '.version = $v' app/appinfo.json > /tmp/appinfo.json
          mv /tmp/appinfo.json app/appinfo.json

      - name: Package
        run: |
          mkdir -p app/tools && cp scripts/dom-homeguard.sh scripts/dom-keys.js scripts/dom-agent.js scripts/dom-blank-home.sh scripts/dom-ctl.sh scripts/dom-tune.sh scripts/install.sh app/tools/
          ares-package app -o out -n
          mv out/*.ipk out/com.deganegane.dom.ipk
          ls -la out

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dom 1.0.${{ github.run_number }}
          files: out/com.deganegane.dom.ipk
          make_latest: true
