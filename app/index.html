<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Dom</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="tube">
<div id="stage">
  <div id="wall"><div class="wall-layer" id="wallA"></div><div class="wall-layer" id="wallB"></div></div>
  <div id="bgblur"></div>
  <div id="bg">
    <div class="bg-layer" id="bgA"><div class="bg-img"></div></div>
    <div class="bg-layer" id="bgB"><div class="bg-img"></div></div>
    <div id="bg-shade"></div>
  </div>
  <div id="night"></div>
  <div id="season"></div>
  <div id="wxfx"><div class="wf-veil"></div><div class="wf-sun"></div><div class="wf-flare"><i></i><i></i><i></i><i></i><i></i></div><div class="wf-bolt"></div><div class="wf-mist"></div><div class="wf wf-a"></div><div class="wf wf-b"></div><div class="wf wf-c"></div><div class="wf-glass"></div><div class="wf-flash"></div></div>

  <div id="greet"></div>
  <div id="osd"></div>
  <div id="widgets"><div class="w-box w-clock"></div><div id="w-forecast" class="w-box"></div><div id="w-stats" class="w-box"></div><div class="w-box w-cw"><div class="w-h">Nastavi gledati</div></div><div class="w-box w-apps"><div class="w-h">Aplikacije</div></div></div>
  <div id="marquee"></div>
  <div id="paper"><div class="pp-top"></div><div class="pp-name">Dom</div><div class="pp-rule"></div></div>
  <div id="ttx">
    <div class="ttx-band"><span>DOM</span></div>
    <div class="ttx-sub">POČETNA STRANICA · KANALI 1-9</div>
    <div class="ttx-keys"><span class="r">OTVORENE APLIKACIJE</span><span class="g">POSTAVKE</span></div>
  </div>
  <div id="topbar">
    <div id="date"></div>
    <div id="clock"></div>
    <div id="weather"></div>
  </div>

  <div id="tabs"><div class="tab active" data-tab="home">Početna</div><div class="tab" data-tab="settings">Postavke</div></div>

  <div id="shelf">
    <div id="shelf-info">
      <div id="shelf-kicker"></div>
      <img id="shelf-logo" alt="">
      <div id="shelf-title"></div>
      <div id="shelf-sub"></div>
      <div id="shelf-progress"><div></div></div>
      <div id="shelf-hint">↑ Nastavi gledati</div>
    </div>
    <div id="cards"></div>
  </div>

  <div id="dockbar"></div>
  <div id="grid-wrap"><div id="grid"></div></div>

  <div id="move-hint">Strelicama premjesti aplikaciju · OK za kraj</div>

  <div id="settings" class="hidden">
    <div id="settings-panel">
      <div id="settings-crumb"></div>
      <h1>Postavke</h1>
      <div id="settings-body"></div>
      <div class="settings-foot">Natrag za zatvaranje</div>
    </div>
  </div>

  <div id="pinpad" class="hidden">
    <div id="pin-box">
      <div id="pin-title"></div>
      <div id="pin-dots"><i></i><i></i><i></i><i></i></div>
      <div id="pin-keys"></div>
    </div>
  </div>

  <div id="crtfx"></div>
  <div id="kino-bars"><i></i><i></i></div>
  <div id="dim"></div>
  <div id="toast"></div>
  <div id="cover"></div>
</div>
</div>
<div id="crt-line"></div>
<script src="earthview.js"></script>
<script src="landscapes.js"></script>
<script src="app.js"></script>
</body>
</html>
